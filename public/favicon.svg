<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D"/>
      <stop offset="100%" stop-color="#050C1A"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16"/>

  <!-- Monogram R&R -->
  <g fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <text x="256" y="320" font-size="210" letter-spacing="-10">R&amp;R</text>
  </g>

  <!-- Accent Gold Star dot -->
  <circle cx="410" cy="380" r="18" fill="#F59E0B"/>
</svg>